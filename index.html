<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seu Futuro Agora - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- HEADER -->
  <header class="bg-green-900 text-white px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="bg-green-700 rounded-lg w-8 h-8 flex items-center justify-center font-bold text-sm">$</div>
      <span class="font-medium text-sm">Seu Futuro Agora</span>
    </div>
    <nav class="hidden md:flex gap-6 text-sm">
      <a href="#" class="text-green-300 font-medium">Dashboard</a>
      <a href="#" class="text-green-200 hover:text-white">Meu Perfil</a>
      <a href="#" class="text-green-200 hover:text-white">Simulador</a>
      <a href="#" class="text-green-200 hover:text-white">Cenários</a>
      <a href="#" class="text-green-200 hover:text-white">Desafios</a>
    </nav>
    <div class="bg-green-700 w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold">TL</div>
  </header>

  <!-- MENU MOBILE -->
  <nav class="md:hidden bg-green-900 border-t border-green-800 flex overflow-x-auto text-sm">
    <a href="#" class="text-green-300 font-medium px-4 py-3 whitespace-nowrap border-b-2 border-green-400">Dashboard</a>
    <a href="#" class="text-green-200 px-4 py-3 whitespace-nowrap">Meu Perfil</a>
    <a href="#" class="text-green-200 px-4 py-3 whitespace-nowrap">Simulador</a>
    <a href="#" class="text-green-200 px-4 py-3 whitespace-nowrap">Cenários</a>
    <a href="#" class="text-green-200 px-4 py-3 whitespace-nowrap">Desafios</a>
  </nav>

  <!-- CONTEÚDO -->
  <main class="max-w-5xl mx-auto px-4 py-6">
    <div class="mb-6">
      <h1 class="text-2xl font-semibold text-green-900">Bom dia, Thiago 👋</h1>
      <p class="text-gray-500 text-sm mt-1">Você está a 35 anos de se aposentar. Continue no ritmo!</p>
    </div>
  </main>

</body>
</html>
